    <path d="M 12 20 L 14 10 L 22 16 Z" fill="#9EE0F7"/>
    <path d="M 52 20 L 50 10 L 42 16 Z" fill="#9EE0F7"/>
    <path d="M 50 13 L 51.5 17 L 55.5 18.5 L 51.5 20 L 50 24 L 48.5 20 L 44.5 18.5 L 48.5 17 Z"
