    <circle cx="22" cy="28" r="2.6" fill="#0A1929"/>
    <circle cx="42" cy="28" r="2.6" fill="#0A1929"/>
    <polygon points="32,33 29.5,30.5 34.5,30.5" fill="#0A1929"/>
    <path d="M 26 36 Q 29 39 32 35 Q 35 39 38 36" fill="none" stroke="#0A1929" stroke-width="2" stroke-linecap="round"/>
    <path d="M 10 30 L 0 28 M 10 33 L -1 34 M 11 36 L 1 39" stroke="#C8EEFA" stroke-width="1.8" stroke-linecap="round"/>
    <path d="M 54 30 L 64 28 M 54 33 L 65 34 M 53 36 L 63 39" stroke="#C8EEFA" stroke-width="1.8" stroke-linecap="round"/>
  </g>
